ServerName localhost
ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# 笔记数据只允许服务端读写，禁止通过 HTTP 直接访问
<LocationMatch "^/_tmp/">
    Require all denied
</LocationMatch>

<FilesMatch "\.data$">
    Require all denied
</FilesMatch>

# 构建期目录，运行期不应可读（内含 Apache 配置副本）
<Directory /var/www/html/docker>
    Require all denied
</Directory>

# 兜底：任何点开头的文件（.env、.gitignore 等）都不允许通过 HTTP 访问
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
