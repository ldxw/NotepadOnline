# 笔记正文编码后上限 4MB，留出表单与转义余量，避免 Nginx 默认 1m 提前 413
client_max_body_size 8m;

# 笔记数据只允许服务端读写，禁止通过 HTTP 直接访问
location ^~ /_tmp/ { deny all; }
location ^~ /docker/ { deny all; }
location ~* \.data$ { deny all; }

location /
{
rewrite ^/share/([A-Za-z0-9._-]+)$ /share.php?f=$1 last;
rewrite ^/([^.]+)$ /index.php?f=$1 last;

#rewrite ^/([a-zA-Z0-9]+)$ /index.php?f=$1;
}

