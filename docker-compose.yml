services:
  notepadonline:
    image: ghcr.io/ldxw/notepadonline:latest
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    container_name: notepadonline
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      # 分享链签名密钥，缺失时分享功能不可用（容器启动会在日志里打印警告）；
      # 在 .env 中设置 NPO_SHARE_SECRET
      NPO_SHARE_SECRET: ${NPO_SHARE_SECRET:-}
      # 站点名称，显示在浏览器标题与导航栏；.env 里不设则用 "NPO"
      NPO_SITE_NAME: ${NPO_SITE_NAME-NPO}
      # 顶部广播条的标题与正文。这里用 `-` 而不是 `:-`：只有 .env 里完全没写才取默认值，
      # 写了空值（NPO_BROADCAST_TITLE=）就是显式置空，两个都空则整条广播不显示
      NPO_BROADCAST_TITLE: ${NPO_BROADCAST_TITLE-广播DEMO}
      NPO_BROADCAST_TEXT: ${NPO_BROADCAST_TEXT-这里是广播DEMO内容}
      # 站点图标地址（可选）。站内相对路径或绝对 URL 均可，留空则不输出图标链接
      NPO_FAVICON: ${NPO_FAVICON-}
      # 配色主题（可选）。取 content/themes/ 下的文件名（不含 .css），
      # 内置 dark、sepia；留空或填不存在的名字都回退默认浅色
      NPO_THEME: ${NPO_THEME-}
      # 页脚文字（可选）。与固定的「© 年份 站点名」合成一行，整行水平居中；
      # 同样用 `-`，.env 里写了空值就是显式不显示文字
      NPO_FOOTER_TEXT: ${NPO_FOOTER_TEXT-}
      # 前端 CDN 公共前缀（可选）。默认 https://cdn.staticfile.org，
      # 留空或格式不对都回退默认；适合整站换镜像源（如自建 / 内网 CDN）
      NPO_CDN_BASE: ${NPO_CDN_BASE-https://cdn.staticfile.org}
      # 下面 8 个是单库地址（可选），优先于上面的前缀，只换其中一个时用。
      # 可填 http(s) 绝对地址，或单个 / 开头的站内路径（如 /vendor/jquery.min.js）
      NPO_CDN_JQUERY: ${NPO_CDN_JQUERY-}
      NPO_CDN_BOOTSTRAP_CSS: ${NPO_CDN_BOOTSTRAP_CSS-}
      NPO_CDN_BOOTSTRAP_JS: ${NPO_CDN_BOOTSTRAP_JS-}
      NPO_CDN_FONTAWESOME_CSS: ${NPO_CDN_FONTAWESOME_CSS-}
      NPO_CDN_FONTAWESOME_JS: ${NPO_CDN_FONTAWESOME_JS-}
      NPO_CDN_WANGEDITOR: ${NPO_CDN_WANGEDITOR-}
      NPO_CDN_CLIPBOARD: ${NPO_CDN_CLIPBOARD-}
      NPO_CDN_FILESAVER: ${NPO_CDN_FILESAVER-}
    security_opt:
      - no-new-privileges:true
    # 只保留 Apache 以 root 绑 80 并降权到 www-data 所需的能力
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
    mem_limit: 512m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      # 默认用命名卷，数据存在 Docker 管理的卷里，随容器重建保留
      - npo-data:/var/www/html/_tmp
      # 想直接在宿主机上看到笔记文件，改用下面这行绑定目录（二选一，不能同时挂）：
      # - ./data:/var/www/html/_tmp
      # 换绑定时记得：mkdir -p data && sudo chown -R 33:33 data
      # （33 是容器内 www-data 的 uid，否则 PHP 无法写入 .data 与 error.log）

volumes:
  npo-data:
